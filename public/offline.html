<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>MoneyLeft — Offline</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1a6b4a">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: Georgia, "Times New Roman", serif;
      background: linear-gradient(150deg, #f0ede8 0%, #e8f0ec 100%);
      color: #1a1a1a;
    }
    .wrap {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      text-align: center;
    }
    .icon { font-size: 5rem; margin-bottom: 1rem; }
    h1 { font-size: 2rem; color: #1a6b4a; margin-bottom: 0.75rem; }
    p { font-size: 1.2rem; color: #57534e; max-width: 28rem; line-height: 1.5; margin-bottom: 1rem; }
    button {
      margin-top: 1.5rem;
      padding: 1rem 2rem;
      font-size: 1.2rem;
      font-weight: bold;
      font-family: inherit;
      background: linear-gradient(135deg, #1a6b4a, #2d9e6b);
      color: white;
      border: none;
      border-radius: 1rem;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(26, 107, 74, 0.2);
    }
    button:active { transform: scale(0.97); }
    .tip {
      margin-top: 2rem;
      padding: 1rem 1.25rem;
      background: white;
      border-radius: 1rem;
      max-width: 28rem;
      font-size: 1rem;
      color: #78716c;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="icon">📶</div>
    <h1>You're offline</h1>
    <p>MoneyLeft needs an internet connection to load your latest data.</p>
    <p>Please check your Wi-Fi or cellular connection, then try again.</p>
    <button onclick="window.location.reload()">Try Again</button>
    <div class="tip">
      💡 <strong>Tip:</strong> Once you're back online, MoneyLeft will sync everything automatically.
    </div>
  </div>
</body>
</html>
